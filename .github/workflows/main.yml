name: Build Lordzinka Client

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: gradle build --no-daemon

      - name: Collect jar
        run: |
          mkdir out
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} out/ \;
          ls -l out

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lordzinka Client build ${{ github.run_number }}
          files: out/*.jar
